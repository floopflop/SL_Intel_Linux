# Surface Laptop 7 (Intel): keep the camera and audio modules out of the initramfs.
#
# dracut copies every module found in the depmod search directories other than the kernel's own
# (updates/, and extra/ where DKMS installs on Fedora) into the initramfs together with their
# dependencies (modules.d/70kernel-modules-extra). After a DKMS build that drags the whole IPU7
# camera stack in: the IPU7 PCI driver then probes inside the initramfs, where its firmware
# (intel/ipu/ipu7_fw.bin) is not available, fails with -ENOENT and is never retried, and the
# camera is gone for that boot. Nothing in early boot needs the camera or the sound card; the
# modules load from the root file system as usual. surface_aggregator_registry stays in (the
# keyboard is needed for a LUKS passphrase) and is made safe by modprobe.d/surface-sam.conf.
# Both spellings are listed because dracut matches the normalised module name.
omit_drivers+=" intel_ipu7_isys intel-ipu7-isys intel_ipu7 intel-ipu7 ipu_bridge ipu-bridge ov02c10 snd_soc_sdw_utils snd-soc-sdw-utils "
