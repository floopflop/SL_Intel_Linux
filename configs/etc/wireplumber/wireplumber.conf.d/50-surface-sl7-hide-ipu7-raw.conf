# Surface Laptop 7: hide the 30+ raw IPU7 V4L2 nodes (Bayer, no ISP, unusable by
# applications) from camera pickers. The camera is exposed through libcamera
# ("Built-in Front Camera"), which does the image processing in software.
monitor.v4l2.rules = [
  {
    matches = [
      { device.name = "~v4l2_device.pci-0000_00_05.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
