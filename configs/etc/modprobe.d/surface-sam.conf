# Surface Laptop 7 (Intel): load the pin controller before the SAM driver.
#
# surface_aggregator (the "surface_serial_hub" driver) takes its wake interrupt from a GPIO on
# the Lunar Lake pin controller (pinctrl_intel_platform, ACPI INTC105D/INTC105F). If the driver
# probes before that controller has registered its GPIO chips, the GPIO lookup fails and the
# driver falls back to a plain-IRQ lookup that returns -EINVAL:
#     surface_serial_hub serial0-0: error -EINVAL: failed to setup IRQ
# The probe is never retried, so keyboard, battery, AC and power button are dead for the whole
# boot. This happens inside the initramfs once modules-load.d/surface-sam.conf is in it (systemd
# loads the SAM stack ~0.2 s before udev has probed the pin controller). A soft dependency makes
# modprobe (and systemd-modules-load, and dracut when it builds the initramfs) load the pin
# controller first; its probe is synchronous, so the GPIOs exist when SAM asks for them.
softdep surface_aggregator pre: pinctrl_intel_platform
