# Surface Laptop 7 (Intel) touchpad tuning for the patched iptsd fork built by iptsd/build.sh in this repository.
#
# Thresholds: measured on this unit by replaying a raw heatmap dump through the detector
# (tools/capture2.sh + iptsd-replay). 24/20 (the iptsd touchpad default) gave zero
# short-lived noise contacts and 1 invalid contact-frame; 20/16 gave 10 and 17; lower
# values merged two close fingers into one blob. Finger contacts here measure
# TOUCH_MAJOR ~800-1320, palm ~1550+ (see /etc/libinput/local-overrides.quirks).

[Contacts]
ActivationThreshold = 24
DeactivationThreshold = 20
# Two fingers about 14 mm apart (scrolling, resting) bridge through the blurred valley between
# them and were spanned as one long contact, so the second finger flickered. Darkening the cells
# around each maximum before spanning keeps close fingers apart (replay of 28 Oct capture: 49
# merge flickers -> 0, no false splits).
PeakSuppressionRadius = 2
PeakSuppressionFactor = 0.3

[Touchpad]
ButtonDebounceMs = 30
# A contact that disappears is not reported lifted until it has been gone this long.
# The tracker also remembers it for the same time, so a finger that blinks gets its
# old slot back and a new finger can never collide with a held slot. While held, the
# slot keeps moving at its last velocity (not frozen), so lifting mid-gesture does not
# read as a stop. Blinks measured on this unit last 1-3 frames (8-25 ms at 120 Hz).
LiftGraceMs = 50
# Exponential smoothing of contact positions (0 = off, 0.5 = average of the last ~2
# frames at 120 Hz). The gaussian fit on 8-bit heatmaps steps in ~0.3 mm increments on
# alternate frames at slow speeds; this evens the deltas libinput sees. Adds ~1 frame
# (8 ms) of latency.
PositionSmoothing = 0.5
# Motion scale while two or more fingers are down (two-finger scroll, pinch, swipes).
# libinput has no touchpad scroll-speed setting on Wayland and derives scroll distance from
# finger travel, so this is the scroll speed knob. 1.0 = unchanged, 0.6 = 60 % of the travel.
MultiFingerMotionScale = 0.6
# Two-finger gestures (scroll, pinch) get their own scale; three or more fingers keep the one above.
TwoFingerMotionScale = 0.45

# Positional deadband (mm) advertised as evdev fuzz so libinput enables its jitter
# hysteresis immediately on every new device instance (iptsd restarts after each
# resume), instead of only after it has detected a finger wobble. 0.25 = libinput's
# own default margin; 0 disables.
HysteresisMm = 0.25
