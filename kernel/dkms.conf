# Surface Laptop 7 (Intel) out-of-tree module fixes. The sources are fetched from kernel.org for
# the exact kernel being built for (network access needed), patched, and built as four modules
# that override the distribution's in /lib/modules/<kernel>/updates.
PACKAGE_NAME="surface-laptop-7-intel"
PACKAGE_VERSION="1.0"
AUTOINSTALL="yes"
PRE_BUILD="fetch-sources.sh ${kernelver}"
CLEAN="rm -rf src"
BUILT_MODULE_NAME[0]="surface_aggregator_registry"
BUILT_MODULE_LOCATION[0]="src/drivers/platform/surface/"
DEST_MODULE_LOCATION[0]="/updates"
BUILT_MODULE_NAME[1]="ov02c10"
BUILT_MODULE_LOCATION[1]="src/drivers/media/i2c/"
DEST_MODULE_LOCATION[1]="/updates"
BUILT_MODULE_NAME[2]="snd-soc-sdw-utils"
BUILT_MODULE_LOCATION[2]="src/sound/soc/sdw_utils/"
DEST_MODULE_LOCATION[2]="/updates"
BUILT_MODULE_NAME[3]="intel-ipu7-isys"
BUILT_MODULE_LOCATION[3]="src/drivers/staging/media/ipu7/"
DEST_MODULE_LOCATION[3]="/updates"
